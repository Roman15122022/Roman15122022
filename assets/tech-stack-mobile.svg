  <text x="32" y="758" font-family="Verdana, sans-serif" font-size="19"><tspan fill="#f2a391">HTML</tspan><tspan fill="#94aaa1"> · </tspan><tspan fill="#8fc5f4">CSS</tspan><tspan fill="#94aaa1"> · </tspan><tspan fill="#87d5df">Tailwind</tspan></text>
  <text x="32" y="787" font-family="Verdana, sans-serif" font-size="19"><tspan fill="#e6afce">Sass</tspan><tspan fill="#94aaa1"> · </tspan><tspan fill="#edcd79">Styled Components</tspan></text>
  <text x="32" y="816" font-family="Verdana, sans-serif" font-size="19"><tspan fill="#c3b9ed">Figma</tspan></text>
