  <text x="32" y="955" font-family="Verdana, sans-serif" font-size="19"><tspan fill="#f2a391">Git</tspan><tspan fill="#94aaa1"> · </tspan><tspan fill="#8fc5f4">GitHub Actions</tspan></text>
  <text x="32" y="984" font-family="Verdana, sans-serif" font-size="19"><tspan fill="#edcd79">AWS</tspan></text>
